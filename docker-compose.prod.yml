services:
  nginx:
    container_name: nginx-dc
    hostname: daycolorbot
    restart: "no"
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    ports:
      - "80:5005"
    env_file:
      - .env
    volumes:
      - type: bind
        source: ./data/www/
        target: /usr/share/nginx/html
    deploy:
      resources:
        limits:
          cpus: '0.1'
        reservations:
          cpus: '0.05'

  redis:
    # Redis is limited to 7.2-bookworm due to licencing change
    # https://redis.io/blog/redis-adopts-dual-source-available-licensing/
    image: redis:7.2-bookworm
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
        reservations:
          cpus: '0.5'


  flask:
    build: 
      dockerfile: docker/flask/Dockerfile
    container_name: dflask
    ports:
      - "5000:5000"
    restart: on-failure
    volumes:
      - type: bind
        source: ./app/flask
        target: /app
      - type: bind
        source: ./data
        target: /data
      #- .:/code
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          cpus: '0.5'
        reservations:
          cpus: '0.2'
